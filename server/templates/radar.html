<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CIVOPS-Radar - Wi-Fi Network Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/radar.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="header-title">CIVOPS-Radar</div>
            <div>Offline-first Wi-Fi situational awareness</div>
        </header>

        <main class="main-layout">
            <section class="panel">
                <h2>Detected Networks</h2>
                <input id="networkSearch" class="search-input" type="search" placeholder="Search SSID / BSSID / vendor">
                <div class="network-list" id="networkItems"></div>
            </section>

            <section class="panel radar-panel">
                <div class="radar-screen" id="radarScreen">
                    <div class="radar-center"></div>
                    <div class="radar-sweep"></div>
                    <div class="range-ring ring-1"></div>
                    <div class="range-ring ring-2"></div>
                    <div class="range-ring ring-3"></div>
                    <div class="scanning-overlay" id="scanningOverlay" style="display:none;"></div>
                </div>
            </section>

            <section class="panel">
                <div class="bottom-groups">
                    <div class="panel-subgroup">
                        <h2>Statistics</h2>
                        <div class="stats-grid">
                            <div class="stat-card">Total: <span id="totalNetworks">0</span></div>
                            <div class="stat-card">Active: <span id="activeNetworks">0</span></div>
                            <div class="stat-card">High Risk: <span id="highRiskNetworks">0</span></div>
                            <div class="stat-card">Open: <span id="openNetworks">0</span></div>
                            <div class="stat-card">Hidden: <span id="hiddenNetworks">0</span></div>
                        </div>
                    </div>

                    <div class="panel-subgroup">
                        <h2>Controls</h2>
                        <div class="controls">
                            <button id="scanButton" class="button scan"><span class="status-indicator"></span>Start Scan</button>
                            <button id="exportButton" class="button export">Export Data</button>
                            <button id="clearButton" class="button clear">Clear Data</button>
                        </div>
                        <p>Status: <span id="statusText">Ready</span></p>
                        <p>Last Update: <span id="lastUpdate">Never</span></p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="network-info" id="networkInfo"></div>
    <script src="{{ url_for('static', filename='js/radar.js') }}"></script>
</body>
</html>
